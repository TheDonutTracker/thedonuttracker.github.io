<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donuts &amp; Do Nots</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6c7d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Donuts">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Palette comes from the bakery case: strawberry frosting for donuts,
   burnt sugar for do nots, dough and chocolate for everything else. */
:root {
  --bg: #fdf6ee;
  --surface: #ffffff;
  --ink: #3a2418;
  --muted: #86695a;
  --line: #efdfd0;
  --dough: #e9b877;
  --frost: #f48fb1;
  --frost-soft: #fde4ec;
  --frost-ink: #a3214f;
  --bad: #c0392b;
  --bad-soft: #fbe3df;
  --bad-ink: #8f2317;
  --ok: #2a7549;
  --amber: #a86400;
  --glass: rgba(170, 215, 235, .16);
  --glass-edge: #a9c6d4;
  --glass-shine: rgba(255, 255, 255, .85);
  --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1410;
    --surface: #2a1e18;
    --ink: #f7ece2;
    --muted: #b89f8f;
    --line: #40302a;
    --dough: #d9a765;
    --frost: #f48fb1;
    --frost-soft: #47202e;
    --frost-ink: #ffb3cb;
    --bad: #ef6b5c;
    --bad-soft: #45201b;
    --bad-ink: #ffb0a6;
    --ok: #86d3a0;
    --amber: #f0b352;
    --glass: rgba(170, 215, 235, .10);
    --glass-edge: #6f8f9e;
    --glass-shine: rgba(255, 255, 255, .28);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
body { padding: max(18px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; margin: 0 auto; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 4px 0 2px; letter-spacing: -0.01em; }
h1 .not { color: var(--bad); }
.status { font-size: 12px; color: var(--muted); margin: 0 0 12px; min-height: 15px; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }

nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 10px; margin-bottom: 6px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 9px 0; font-family: var(--display); font-weight: 500; font-size: 13.5px; cursor: pointer; position: relative; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 17px; padding: 0 4px; font-family: var(--body); font-weight: 600; }
.view { display: none; }
.view.on { display: block; }

.jars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.jar { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 12px; text-align: center; }
.jar svg { width: 100%; max-width: 140px; height: auto; display: block; margin: 0 auto; }
.jar .big { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin-top: 4px; }
.jar .what { font-family: var(--display); font-weight: 500; font-size: 15px; margin-top: 2px; }
.jar .next { color: var(--muted); font-size: 12.5px; line-height: 1.3; margin: 6px 0 10px; min-height: 33px; }
.jar.good .big { color: var(--frost-ink); }
.jar.bad .big { color: var(--bad-ink); }
.give { width: 100%; border: 0; border-radius: 12px; padding: 13px 8px; font-family: var(--display); font-weight: 700; font-size: 16px; cursor: pointer; }
.give.good { background: var(--frost); color: #4a0f26; }
.give.bad { background: var(--bad); color: #fff; }
.give:active { transform: scale(.98); }

h2 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 24px 0 4px; }
.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; line-height: 1.4; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .txt { flex: 1; min-width: 0; }
.item .name { font-size: 15.5px; line-height: 1.25; }
.item .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.cost { flex: none; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--frost-ink); background: var(--frost-soft); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
.act { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; cursor: pointer; }
.act:disabled { opacity: .38; cursor: default; }
.act.sure { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.act.go { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
.trade { margin-top: 12px; }
.owed { display: flex; align-items: center; gap: 12px; padding: 14px; }
.owed .num { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--bad-ink); min-width: 34px; text-align: center; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.dot.donut, .dot.reward { background: var(--frost); }
.dot.donot, .dot.sentence { background: var(--bad); }
.entry { border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry .item { border-top: 0; }
.entry .talk { padding: 0 14px 12px 34px; }
.entry .say { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 3px; }
.entry .say.hot { color: var(--amber); font-weight: 600; }
.empty { padding: 16px 14px; color: var(--muted); font-size: 14px; }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--muted); padding: 11px; font-size: 13.5px; cursor: pointer; }

/* wheel */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
.seg button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 9px; font-family: var(--display); font-weight: 500; font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--frost); color: #4a0f26; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lvl { background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; cursor: pointer; text-align: center; }
.lvl .n { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.lvl .w { display: block; font-family: var(--display); font-weight: 500; font-size: 14px; margin-top: 1px; }
.lvl[aria-pressed="true"] { border-color: var(--bad); color: var(--ink); box-shadow: inset 0 0 0 1px var(--bad); }
.why { color: var(--muted); font-size: 13px; line-height: 1.4; margin: 10px 2px 18px; min-height: 18px; }
.stage { position: relative; width: min(100%, 440px); aspect-ratio: 1; margin: 0 auto; }
.stage canvas { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 7px var(--dough), 0 10px 30px rgba(60, 30, 10, .25); }
.pointer { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); width: 0; height: 0; z-index: 2;
  border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 26px solid var(--ink); }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26%; aspect-ratio: 1; border-radius: 50%;
  background: var(--bg); border: 7px solid var(--dough); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 17px; cursor: pointer; z-index: 2; }
.hub:disabled { cursor: default; opacity: .8; }
.result { margin-top: 22px; padding: 16px; text-align: center; }
.result .label { color: var(--bad-ink); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.result .rname { font-family: var(--display); font-weight: 700; font-size: 23px; margin: 6px 0 4px; }
.result .detail { color: var(--muted); font-size: 15px; line-height: 1.45; }
.result .act { margin-top: 12px; padding: 11px 16px; font-size: 15px; }

/* reason sheet */
.veil { position: fixed; inset: 0; background: rgba(20, 10, 5, .45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
.veil.open { display: flex; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 16px 22px; max-height: 92vh; overflow-y: auto; }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0 0 3px; }
.sheet p { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.chip .pips { color: var(--bad); margin-left: 6px; font-size: 11px; letter-spacing: 1px; vertical-align: 1px; }
.own { display: flex; gap: 8px; margin-top: 14px; }
.own input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit; }
.own input:focus { outline: 2px solid var(--frost); outline-offset: 1px; }
.own button { border: 0; border-radius: 12px; padding: 0 16px; font-family: var(--display); font-weight: 700; font-size: 15px; cursor: pointer; background: var(--ink); color: var(--bg); }
.sev { display: none; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.sheet.bad .sev { display: flex; }
.sev button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 9px; padding: 6px 11px; font-size: 13.5px; cursor: pointer; }
.sev button[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.cancel { display: block; width: 100%; margin-top: 12px; border: 0; background: transparent; color: var(--muted); padding: 10px; font-size: 15px; cursor: pointer; }
#app { display: none; }
body.open #app { display: block; }
body.open #gate { display: none; }
#gate { max-width: 340px; margin: 12vh auto 0; text-align: center; }
#gate svg { width: 120px; height: 120px; }
#gate h1 { margin-top: 14px; }
#gate form { display: flex; gap: 8px; margin-top: 22px; }
#gate input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 13px 12px; font-size: 16px; font-family: inherit; }
#gate input:focus { outline: 2px solid var(--frost); outline-offset: 1px; }
#gate form button { border: 0; border-radius: 12px; padding: 0 18px; font-family: var(--display); font-weight: 700; font-size: 16px; cursor: pointer; background: var(--frost); color: #4a0f26; }
#gate .msg { color: var(--bad); font-size: 13.5px; min-height: 18px; margin-top: 10px; }
.jarbox { text-align: center; margin: 4px 0 16px; }
.jarbox svg { width: 190px; height: auto; display: block; margin: 0 auto; }
.jarCount { font-family: var(--display); font-weight: 700; font-size: 18px; margin-top: 6px; }
.jarTally { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.pill { font-size: 13px; border-radius: 999px; padding: 5px 11px; border: 1px solid var(--line); background: var(--surface); }
.pill b { font-family: var(--display); margin-right: 4px; }
.pill.yes b { color: var(--ok); } .pill.counter b { color: var(--amber); } .pill.no b { color: var(--muted); }
.tag.counter { color: var(--amber); background: transparent; border: 1px solid var(--amber); }
.idea .reply { border-left: 3px solid var(--amber); padding: 4px 0 4px 10px; margin: 8px 0 2px; font-size: 14.5px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.idea .reply.cond { border-left-color: var(--ok); }
.idea .reply.cond span { color: var(--ok); }
.idea .reply span { display: block; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--amber); margin-bottom: 2px; }
.idea .msgs, .entry .msgs { margin: 6px 0 2px; display: grid; gap: 6px; }
.idea .msg, .entry .msg { max-width: 88%; border-radius: 12px; padding: 7px 10px; font-size: 14.5px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); justify-self: start; }
.idea .msg.keeper, .entry .msg.keeper { justify-self: end; background: transparent; border-color: var(--amber); }
.idea .msg span, .entry .msg span { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
.idea .turn, .entry .turn { font-size: 12.5px; color: var(--amber); margin-top: 6px; }
.idea .counterForm, .entry .counterForm { display: flex; gap: 8px; margin-top: 8px; }
.idea .counterForm input, .entry .counterForm input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 10px; font-size: 16px; font-family: inherit; }
.ideaForm { padding: 14px; }
.ideaForm .chip { padding: 8px 12px; font-size: 14px; }
.ideaForm .chip[aria-pressed="true"] { background: var(--frost); border-color: var(--frost); color: #4a0f26; }
.ideaForm textarea { display: block; width: 100%; margin: 12px 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit; resize: vertical; }
.ideaForm textarea:focus { outline: 2px solid var(--frost); outline-offset: 1px; }
.ideaMsg { font-size: 13px; color: var(--muted); min-height: 16px; margin-top: 8px; text-align: center; }
.tag { display: inline-block; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--frost-ink); background: var(--frost-soft); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
.tag.yes { color: var(--ok); background: transparent; border: 1px solid var(--ok); }
.tag.no { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.idea { display: block; padding: 12px 14px; border-top: 1px solid var(--line); }
.idea:first-child { border-top: 0; }
.idea .body { font-size: 15.5px; line-height: 1.35; margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.idea .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.forget { display: block; margin: 34px auto 0; border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px; }
@media (prefers-reduced-motion: no-preference) { .jar svg .fill { transition: stroke-dashoffset .5s ease; } }
</style>
</head>
<body>
<div id="gate">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="38" fill="none" stroke="var(--dough)" stroke-width="30"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="var(--frost)" stroke-width="22"/>
  </svg>
  <h1>Donuts &amp; Do <span class="not">Nots</span></h1>
  <form id="gateForm">
    <input type="password" id="gateKey" placeholder="Passcode" autocomplete="off" autocapitalize="off" aria-label="Passcode">
    <button type="submit">Open</button>
  </form>
  <div class="msg" id="gateMsg"></div>
</div>
<main id="app">
  <h1>Donuts &amp; Do <span class="not">Nots</span></h1>
  <p class="status" id="status">Loading...</p>

  <nav>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="jars" aria-selected="true">Jars</button>
      <button role="tab" data-view="prizes" aria-selected="false">Prizes</button>
      <button role="tab" data-view="wheel" aria-selected="false">Wheel<span class="badge" id="wheelBadge" hidden></span></button>
      <button role="tab" data-view="ledger" aria-selected="false">Ledger<span class="badge" id="ledgerBadge" hidden></span></button>
      <button role="tab" data-view="ideas" aria-selected="false">Ideas<span class="badge" id="ideasBadge" hidden></span></button>
    </div>
  </nav>

  <!-- JARS -->
  <section class="view on" id="view-jars">
    <div class="jars">
      <div class="jar good">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="38" fill="none" stroke="var(--dough)" stroke-width="30"/>
          <circle class="fill" id="ringGood" cx="60" cy="60" r="38" fill="none" stroke="var(--frost)" stroke-width="22"
                  stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
          <g id="sprinkles" stroke-width="3.2" stroke-linecap="round" opacity="0">
            <line x1="60" y1="16" x2="65" y2="20" stroke="#fff"/><line x1="92" y1="38" x2="97" y2="35" stroke="#7ad0c3"/>
            <line x1="99" y1="68" x2="96" y2="74" stroke="#ffe08a"/><line x1="78" y1="95" x2="84" y2="94" stroke="#fff"/>
            <line x1="44" y1="98" x2="40" y2="93" stroke="#7ad0c3"/><line x1="21" y1="72" x2="22" y2="66" stroke="#ffe08a"/>
            <line x1="26" y1="40" x2="31" y2="36" stroke="#fff"/>
          </g>
        </svg>
        <div class="big" id="goodNum">0</div>
        <div class="what">Donuts</div>
        <div class="next" id="goodNext"></div>
        <button class="give good" id="giveGood">+ Donut</button>
      </div>
      <div class="jar bad">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="38" fill="none" stroke="var(--dough)" stroke-width="30"/>
          <circle class="fill" id="ringBad" cx="60" cy="60" r="38" fill="none" stroke="var(--bad)" stroke-width="22"
                  stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
          <line x1="24" y1="24" x2="96" y2="96" stroke="var(--bad)" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <div class="big" id="badNum">0</div>
        <div class="what">Do Nots</div>
        <div class="next" id="badNext"></div>
        <button class="give bad" id="giveBad">+ Do Not</button>
      </div>
    </div>

    <div class="card trade">
      <div class="item">
        <div class="txt">
          <div class="name">The trade</div>
          <div class="meta">1 donut erases 1 Do Not, oldest first.</div>
        </div>
        <button class="act" id="tradeBtn" disabled>Trade</button>
      </div>
    </div>

    <h2>The penalty box</h2>
    <p class="sub" id="penaltySub"></p>
    <div class="card">
      <div class="owed">
        <div class="num" id="owedNum">0</div>
        <div class="txt" style="flex:1">
          <div class="name" id="owedText">Nothing owed.</div>
          <div class="meta" id="owedMeta"></div>
        </div>
        <button class="act go" id="toWheel" hidden>Spin</button>
      </div>
    </div>

    <h2>Sentences to serve</h2>
    <div class="card" id="pending"></div>
  </section>

  <!-- PRIZES -->
  <section class="view" id="view-prizes">
    <h2 style="margin-top:8px">The prize counter</h2>
    <p class="sub" id="prizeSub"></p>
    <div class="card" id="prizes"></div>
  </section>

  <!-- WHEEL -->
  <section class="view" id="view-wheel">
    <div class="seg" id="wheelPick">
      <button data-wheel="anytime" aria-pressed="true"></button>
      <button data-wheel="bed" aria-pressed="false"></button>
    </div>
    <div class="levels" id="levels">
      <button class="lvl" data-level="1" aria-pressed="true"><span class="n">Level 1</span><span class="w"></span></button>
      <button class="lvl" data-level="2" aria-pressed="false"><span class="n">Level 2</span><span class="w"></span></button>
      <button class="lvl" data-level="3" aria-pressed="false"><span class="n">Level 3</span><span class="w"></span></button>
    </div>
    <p class="why" id="why"></p>
    <div class="stage">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="960" height="960" aria-label="Wheel"></canvas>
      <button class="hub" id="spin">Spin</button>
    </div>
    <div class="card result" aria-live="polite">
      <div class="label" id="rLabel">Her sentence</div>
      <div class="rname" id="rName">Spin to find out</div>
      <div class="detail" id="rDetail">No respins allowed.</div>
      <button class="act" id="record" hidden>Record this sentence</button>
    </div>
  </section>

  <!-- LEDGER -->
  <section class="view" id="view-ledger">
    <h2 style="margin-top:8px">The ledger</h2>
    <p class="sub" id="ledgerSub"></p>
    <div class="card" id="ledger"></div>
  </section>

  /* ---------- shared storage (Supabase) ----------

  var API = "https://zquvatrihtctugeqqoju.supabase.co/rest/v1/dn_ledger";
  var API_KEY = "sb_publishable_88Tn8Xn2e_ixTlwZfEGzKg_CDTOkqrD";
  var FIELDS = "id,kind,label,detail,amount,pts,level,wheel,served,served_at,created_at";
  var CACHE = "donuts.rows.v3", ADDS = "donuts.adds.v3", PATCHES = "donuts.patches.v3", DELS = "donuts.dels.v3", PASS = "donuts.pass.v1";
  var KINDS = ["donut", "donot", "reward", "sentence"];

  var server = [];       // rows as last seen on the server
  var adds = {};         // id -> row waiting to be sent
  var patches = {};      // id -> fields waiting to be sent
  var dels = {};         // id -> true, waiting to be removed
  var inflight = {};

  function readJSON(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v || fallback; } catch (e) { return fallback; }
  }
  function saveLocal() {
    try {
      localStorage.setItem(CACHE, JSON.stringify(server));
      localStorage.setItem(ADDS, JSON.stringify(adds));
      localStorage.setItem(PATCHES, JSON.stringify(patches));
      localStorage.setItem(DELS, JSON.stringify(dels));
    } catch (e) {}
  }
  function clearLocal() {
    [CACHE, ADDS, PATCHES, DELS, PASS].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
  }

    return { apikey: API_KEY, Authorization: "Bearer " + API_KEY, "Content-Type": "application/json", Prefer: "return=minimal", "x-pass": passToken };
  }

    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

  /* Everything the page shows comes from this merged list, oldest first. */
  function rows() {
    var seen = {}, out = [];
    server.forEach(function (r) {

      if (patches[r.id]) {

        Object.keys(r).forEach(function (k) { c[k] = r[k]; });
        Object.keys(patches[r.id]).forEach(function (k) { c[k] = patches[r.id][k]; });
        r = c;
      }
      out.push(r);

    Object.keys(adds).forEach(function (id) { if (!seen[id] && !dels[id]) out.push(adds[id]); });

  }

  function tally(list) {
    var t = { donut: 0, spent: 0, cleared: 0, donots: [], pending: [] };
    list.forEach(function (r) {
      if (r.kind === "donut") t.donut++;
      else if (r.kind === "donot") t.donots.push(r);
      else if (r.kind === "reward") { t.spent += r.amount || 0; if (r.label === WIPE) t.cleared++; }

  function add(body) {

  function lastWord(x) {
    var t = thread(x.id);
    return t.length ? t[t.length - 1].who : "keeper";
  }
  function pullReplies() {
    fetch(REPLIES_API + "?select=id,idea_id,who,text,created_at&order=created_at.asc&limit=1000", { headers: headers(), cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (list) {
        var before = JSON.stringify(replies);
        replies = list.filter(function (x) { return x && typeof x.text === "string"; });
        if (JSON.stringify(replies) !== before && !counterFor && !condFor && !typingInIdeas()) renderIdeas();
      })
      .catch(function () {});
  }
  function sendReply(id, text) {
    var row = { id: uuid(), idea_id: id, who: readOnly ? "guest" : "keeper", text: text.slice(0, 300), created_at: new Date().toISOString() };
    replies.push(row); delete replyDrafts[id]; renderIdeas();
    fetch(REPLIES_API, { method: "POST", headers: headers(), body: JSON.stringify(row) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); })
      .catch(function () {
        replies = replies.filter(function (x) { return x.id !== row.id; });
        replyDrafts[id] = text; ideaMsg("That reply didn't go through. Try again in a moment."); renderIdeas();
      });
  }
  function pullIdeas() {
    fetch(IDEAS_API + "?select=id,kind,text,status,reply,condition,created_at&order=created_at.desc&limit=200", { headers: headers(), cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (list) {
        var before = JSON.stringify(ideas);
        ideas = list.filter(function (x) { return x && typeof x.text === "string"; });
        if (JSON.stringify(ideas) !== before && !counterFor && !condFor && !typingInIdeas()) renderIdeas();
      })
      .catch(function () {});
    pullReplies();
  }
  function kindName(k) {
    for (var n = 0; n < IDEA_KINDS.length; n++) if (IDEA_KINDS[n].k === k) return IDEA_KINDS[n].t;
    return "Idea";
  }
  var counterFor = "", counterDraft = "", condFor = "", condDraft = "";
  /* One slip of paper per suggestion still waiting, piled up from the bottom of the jar. */
  function drawJar(waiting) {
    var NS = "http://www.w3.org/2000/svg", g = $("jarTickets");
    while (g.firstChild) g.removeChild(g.firstChild);
    var shown = Math.min(waiting, 18);
    for (var n = 0; n < shown; n++) {
      var row = Math.floor(n / 3), col = n % 3;
      var wob = Math.sin((n + 1) * 12.9898) * 43758.5453; wob = wob - Math.floor(wob);       // steady scatter, same every draw
      var x = 50 + col * 33 + (wob - .5) * 10, y = 184 - row * 23 + (wob - .5) * 6, tilt = (wob - .5) * 44;
      var t = document.createElementNS(NS, "g");
      t.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + tilt.toFixed(1) + " 20 10)");
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("width", "40"); r.setAttribute("height", "20"); r.setAttribute("rx", "3");
      r.setAttribute("fill", n % 2 ? "var(--frost)" : "var(--frost-soft)"); r.setAttribute("stroke", "var(--frost-ink)"); r.setAttribute("stroke-width", "1");
      var l = document.createElementNS(NS, "line");
      l.setAttribute("x1", "10"); l.setAttribute("x2", "10"); l.setAttribute("y1", "3"); l.setAttribute("y2", "17");
      l.setAttribute("stroke", "var(--frost-ink)"); l.setAttribute("stroke-width", "1"); l.setAttribute("stroke-dasharray", "2 2");
      t.appendChild(r); t.appendChild(l); g.appendChild(t);
    }
  }
  function renderIdeas() {
    var kinds = $("ideaKinds");
    kinds.textContent = "";
    IDEA_KINDS.forEach(function (it) {
      var c = el("button", "chip", it.t); c.type = "button";
      c.setAttribute("aria-pressed", it.k === ideaKind ? "true" : "false");
      c.addEventListener("click", function () { ideaKind = it.k; renderIdeas(); });
      kinds.appendChild(c);
    });
    var n = { new: 0, accepted: 0, countered: 0, declined: 0 };
    ideas.forEach(function (x) { if (n[x.status] !== undefined) n[x.status]++; else n.new++; });
    drawJar(n.new);
    $("jarCount").textContent = n.new ? plural(n.new, "ticket", "tickets") + " waiting in the jar" : "The jar is empty";
    var tallyBox = $("jarTally");
    tallyBox.textContent = "";
    [["yes", n.accepted, "approved"], ["counter", n.countered, "counter offered"], ["no", n.declined, "rejected"]].forEach(function (p) {
      var pill = el("span", "pill " + p[0]);
      pill.appendChild(el("b", "", String(p[1]))); pill.appendChild(document.createTextNode(p[2]));
      tallyBox.appendChild(pill);
    });
    var badge = $("ideasBadge");
    var mine = ideas.filter(function (x) { return x.status === "countered" && lastWord(x) === (readOnly ? "keeper" : "guest"); }).length;
    var due = readOnly ? mine : n.new + mine;            // tickets where it's this person's move
    badge.hidden = !due; badge.textContent = due;

    var box = $("ideas");
    box.textContent = "";
    if (!ideas.length) { box.appendChild(el("div", "empty", "Nothing has been suggested yet.")); return; }
    ideas.forEach(function (x) {
      var row = el("div", "idea");
      row.appendChild(el("span", "tag", kindName(x.kind)));
      if (x.status === "accepted") row.appendChild(el("span", "tag yes", x.condition ? "Approved with a condition" : "Approved"));
      else if (x.status === "declined") row.appendChild(el("span", "tag no", "Rejected"));
      else if (x.status === "countered") row.appendChild(el("span", "tag counter", "Counter offer"));
      else row.appendChild(el("span", "tag no", "Waiting"));
      row.appendChild(el("div", "body", x.text));
      if (x.reply) {
        var rep = el("div", "reply");
        rep.appendChild(el("span", "", "Counter offer")); rep.appendChild(document.createTextNode(x.reply));
        row.appendChild(rep);
      }
      var t = thread(x.id);
      if (t.length) {
        var msgs = el("div", "msgs");
        t.forEach(function (m) {
          var b = el("div", "msg " + (m.who === "keeper" ? "keeper" : "guest"));
          b.appendChild(el("span", "", m.who === "keeper" ? KEEPER : NAME)); b.appendChild(document.createTextNode(m.text));
          msgs.appendChild(b);
        });
        row.appendChild(msgs);
      }
      if (x.status === "accepted" && x.condition) {
        var cond = el("div", "reply cond");
        cond.appendChild(el("span", "", "Condition")); cond.appendChild(document.createTextNode(x.condition));
        row.appendChild(cond);
      }
      if (x.status === "countered") {
        var whose = lastWord(x) === "keeper" ? NAME : KEEPER;
        row.appendChild(el("div", "turn", "Waiting on " + whose));
        var rf = el("form", "counterForm"), rin = el("input");
        rin.type = "text"; rin.maxLength = 300; rin.placeholder = "Argue your case"; rin.value = replyDrafts[x.id] || "";
        rin.addEventListener("input", function () { replyDrafts[x.id] = rin.value; });
        var rgo = el("button", "act", "Reply"); rgo.type = "submit";
        rf.appendChild(rin); rf.appendChild(rgo);
        rf.addEventListener("submit", function (e) {
          e.preventDefault();
          var v = rin.value.trim();
          if (!v) { rin.focus(); return; }
          rin.blur(); sendReply(x.id, v);
        });
        row.appendChild(rf);
      }
      row.appendChild(el("div", "meta", when(x.created_at)));
      if (!readOnly) {
        var acts = el("div", "acts");
        var ok = el("button", "act", "Approve"); ok.disabled = x.status === "accepted" && !x.condition;
        ok.addEventListener("click", function () { condFor = ""; ruleOn(x.id, { status: "accepted", condition: null }); });
        var iff = el("button", "act", "Approve if\u2026");
        iff.addEventListener("click", function () { condFor = condFor === x.id ? "" : x.id; counterFor = ""; condDraft = x.condition || ""; renderIdeas(); });
        var no = el("button", "act", "Reject"); no.disabled = x.status === "declined";
        no.addEventListener("click", function () { ruleOn(x.id, { status: "declined" }); });
        var co = el("button", "act", "Counter");
        co.addEventListener("click", function () { counterFor = counterFor === x.id ? "" : x.id; condFor = ""; counterDraft = x.reply || ""; renderIdeas(); });
        var d = el("button", "act");
        twoTap(d, "Delete", "Sure?", function () { tossIdea(x.id); });
        acts.appendChild(ok); acts.appendChild(iff); acts.appendChild(co); acts.appendChild(no); acts.appendChild(d);
        row.appendChild(acts);
        if (condFor === x.id) {
          var cf = el("form", "counterForm"), cin = el("input");
          cin.type = "text"; cin.maxLength = 300; cin.placeholder = "Approved, on the condition that..."; cin.value = condDraft;
          cin.addEventListener("input", function () { condDraft = cin.value; });
          var cgo = el("button", "act", "Approve"); cgo.type = "submit";
          cf.appendChild(cin); cf.appendChild(cgo);
          cf.addEventListener("submit", function (e) {
            e.preventDefault();
            var v = cin.value.trim();
            if (!v) { cin.focus(); return; }
            condFor = ""; condDraft = "";
            ruleOn(x.id, { status: "accepted", condition: v.slice(0, 300) });
          });
          row.appendChild(cf);
        }
        if (counterFor === x.id) {
          var f = el("form", "counterForm"), inp = el("input");
          inp.type = "text"; inp.maxLength = 300; inp.placeholder = "Your counter offer"; inp.value = counterDraft;
          inp.addEventListener("input", function () { counterDraft = inp.value; });
          var go2 = el("button", "act", "Send"); go2.type = "submit";
          f.appendChild(inp); f.appendChild(go2);
          f.addEventListener("submit", function (e) {
            e.preventDefault();
            var v = inp.value.trim();
            if (!v) { inp.focus(); return; }
            counterFor = ""; counterDraft = "";
            ruleOn(x.id, { status: "countered", reply: v.slice(0, 300) });
          });
          row.appendChild(f);
        }
      }
      box.appendChild(row);
    });
  }
  function ideaMsg(text) { $("ideaMsg").textContent = text; }
  function sendIdea() {
    var text = $("ideaText").value.trim();
    if (!text) { $("ideaText").focus(); return; }
    if (ideaBusy) return;
    ideaBusy = true; ideaMsg("Sending...");
    var row = { id: uuid(), kind: ideaKind, text: text.slice(0, 300), status: "new", created_at: new Date().toISOString() };
    fetch(IDEAS_API, { method: "POST", headers: headers(), body: JSON.stringify(row) })
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        ideas.unshift(row); $("ideaText").value = ""; ideaMsg("It's in the jar."); renderIdeas();
      })
      .catch(function () { ideaMsg("That didn't go through. Try again in a moment."); })
      .then(function () { ideaBusy = false; });
  }
  function ruleOn(id, fields) {
    if (readOnly) return;
    ideas.forEach(function (x) { if (x.id === id) Object.keys(fields).forEach(function (k) { x[k] = fields[k]; }); });
    renderIdeas();
    fetch(IDEAS_API + "?id=eq." + encodeURIComponent(id), { method: "PATCH", headers: headers(), body: JSON.stringify(fields) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); })
      .catch(function () { ideaMsg("That didn't save. Try again in a moment."); pullIdeas(); });
  }
  function tossIdea(id) {
    if (readOnly) return;
    ideas = ideas.filter(function (x) { return x.id !== id; });
    renderIdeas();
    fetch(IDEAS_API + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); })
      .catch(function () { ideaMsg("That didn't save. Try again in a moment."); pullIdeas(); });
  }
  $("ideaSend").addEventListener("click", sendIdea);

  /* ---------- the gate ---------- */
  function b64(str) {
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var n = 0; n < bin.length; n++) out[n] = bin.charCodeAt(n);
    return out;
  }
  function unseal(key, part) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(part.iv) }, key, b64(part.data));
  }
  /* Resolves { role, config, token } when the passcode fits either lock, rejects when it fits neither. */
  function tryPass(pass) {
    var enc = new TextEncoder(), subtle = crypto.subtle;
    return subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return subtle.deriveKey({ name: "PBKDF2", salt: b64(SEALED.salt), iterations: SEALED.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return unseal(key, SEALED.wraps[0]).then(function (k) { return { role: "view", k: k }; }, function () {
        return unseal(key, SEALED.wraps[1]).then(function (k) { return { role: "edit", k: k }; });
      });
    }).then(function (got) {
      return subtle.importKey("raw", got.k, "AES-GCM", false, ["decrypt"]).then(function (ck) {
        return unseal(ck, SEALED.content);
      }).then(function (plain) {
        return subtle.digest("SHA-256", enc.encode("dn1|" + pass)).then(function (hash) {
          var hex = Array.prototype.map.call(new Uint8Array(hash), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
          return { role: got.role, config: JSON.parse(new TextDecoder().decode(plain)), token: hex };
        });
      });
    });
  }
  var started = false;
  function openUp(pass, got) {
    applyConfig(got.config);
    passToken = got.token;
    readOnly = got.role !== "edit";
    try { localStorage.setItem(PASS, pass); } catch (e) {}
    server = clean(readJSON(CACHE, []));
    if (!readOnly) { adds = readJSON(ADDS, {}); patches = readJSON(PATCHES, {}); dels = readJSON(DELS, {}); }
    document.body.classList.add("open");
    setStatus("", "Loading...");
    render(); renderIdeas();
    pull();
    if (started) return;
    started = true;
    setInterval(function () { if (passToken && !document.hidden && !spinning && !veil.classList.contains("open")) pull(); }, 5000);
    document.addEventListener("visibilitychange", function () { if (passToken && !document.hidden) pull(); });
  }
  function gateMsg(text) { $("gateMsg").textContent = text; }
  $("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = $("gateKey").value.trim();
    if (!pass) return;
    if (!window.crypto || !crypto.subtle) { gateMsg("This browser can't open the page. Try Safari or Chrome."); return; }
    gateMsg("Checking...");
    tryPass(pass).then(function (got) { gateMsg(""); $("gateKey").value = ""; openUp(pass, got); },
                       function () { gateMsg("That passcode doesn't fit."); });
  });
  $("forget").addEventListener("click", function () {
    passToken = ""; readOnly = true; server = []; adds = {}; patches = {}; dels = {}; ideas = []; replies = []; replyDrafts = {}; notes = []; noteOpen = {}; noteDrafts = {};
    clearLocal();
    document.body.classList.remove("open");
    go("jars");
  });
  (function () {
    var saved = "";
    try { saved = localStorage.getItem(PASS) || ""; } catch (e) {}
    if (saved && window.crypto && crypto.subtle) {
      tryPass(saved).then(function (got) { openUp(saved, got); }, function () { clearLocal(); });
    }
  })();
})();
</script>
</body>
